name: Build and Release luci-theme-peditxosui

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev gawk git gettext unzip zlib1g-dev file python3 python3-venv curl

      - name: Setup OpenWrt SDK
        run: |
          set -e
          wget -q https://downloads.openwrt.org/releases/23.05.0/targets/x86/64/openwrt-sdk-23.05.0-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz
          mkdir sdk && tar -xJf openwrt-sdk-23.05.0-x86-64_gcc-12.3.0_musl.Linux-x86_64.tar.xz -C sdk --strip-components=1
          cd sdk
          echo "src-git packages https://github.com/openwrt/packages.git" > feeds.conf.default
          echo "src-git luci https://github.com/openwrt/luci.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add luci-theme-peditxosui package
        run: |
          set -e
          cd sdk/package
          git clone https://github.com/peditx/luci-theme-peditxosui.git
          cd ..
          echo "CONFIG_PACKAGE_luci-theme-peditxosui=m" >> .config

      - name: Build luci-theme-peditxosui
        run: |
          set -e
          cd sdk
          make defconfig
          make package/luci-theme-peditxosui/compile -j1 V=sc

      - name: Save luci-theme-peditxosui package
        run: |
          cd sdk
          mkdir -p artifacts
          find bin/ -name "*.ipk" -exec cp {} artifacts/ \;

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: luci-theme-peditxosui ${{ github.ref_name }}
          body: |
            ## PeDitXOSui Theme ${{ github.ref_name }}

            ### Features
            - 🌓 Dark & Light Mode
            - 📱 Fully Responsive Design
            - 🎨 Modern Glassmorphism UI
            - 🧭 Bottom Navigation Bar
            - 📊 Dashboard with Quick Status
            - 🔧 Easy UCI Configuration

            ### Installation
            ```bash
            opkg install luci-theme-peditxosui_*.ipk
            ```

            ### Changes
            - See [CHANGELOG.md](https://github.com/peditx/luci-theme-peditxosui/blob/main/CHANGELOG.md) for details
          files: artifacts/luci-theme-peditxosui_*.ipk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-peditxosui
          path: artifacts/
