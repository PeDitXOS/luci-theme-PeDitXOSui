name: Build and Release luci-theme-peditxosui

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build IPK + APK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install zstd for APK
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Build packages
        run: |
          set -e
          chmod +x build-theme.sh
          ./build-theme.sh

      - name: Upload IPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-peditxosui-ipk
          path: artifacts-ipk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-theme-peditxosui-apk
          path: artifacts-apk/

  release:
    name: Create Release
    needs: [build]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: luci-theme-peditxosui ${{ github.ref_name }}
          body: |
            ## PeDitXOSui Theme ${{ github.ref_name }}

            ### Features
            - 🌓 Dark & Light Mode
            - 📱 Fully Responsive Design
            - 🎨 Modern Glassmorphism UI
            - 🧭 Bottom Navigation Bar
            - 📊 Dashboard with Quick Status
            - 🔧 Easy UCI Configuration
            - 📡 WiFi & LAN Device Detection
            - 📌 Static DHCP Lease

            ### Installation

            **IPK (OpenWrt 23.05 / 24.10):**
            ```bash
            opkg install luci-theme-peditxosui_*.ipk
            ```

            **APK (OpenWrt 25.12+):**
            ```bash
            apk add luci-theme-peditxosui_*.apk
            ```
          files: |
            luci-theme-peditxosui-ipk/*
            luci-theme-peditxosui-apk/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
